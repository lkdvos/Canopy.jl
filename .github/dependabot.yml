# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # To group all GitHub Actions updates into a single PR, uncomment the following:
    # groups:
    #   github-actions:
    #     patterns:
    #       - "*"
  - package-ecosystem: "julia"
    # Only the root: it declares a [workspace] spanning test/, docs/, examples/ and benchmark/,
    # so dependabot already resolves every sub-project from here. Listing them separately just
    # produces duplicate PRs for the same edit.
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      julia-dependencies:
        patterns:
          - "*"
